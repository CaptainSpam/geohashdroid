apply plugin: 'com.android.application'

android {
    compileSdkVersion 37
    defaultConfig {
        applicationId "net.exclaimindustries.geohashdroid"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdkVersion 21
        targetSdkVersion 37
        multiDexEnabled true
        versionCode 946
        versionName '0.9.7.0'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace 'net.exclaimindustries.geohashdroid'
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    def appcompat_version = "1.7.0-alpha01"
    def work_version = "2.7.1"
    def test_version = "1.7.0"

    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.appcompat:appcompat-resources:$appcompat_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'org.opensextant:geodesy:2.0.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'com.google.guava:guava:27.0.1-android'
    implementation "androidx.exifinterface:exifinterface:1.3.4"
    implementation "androidx.activity:activity:1.2.0"
    implementation "androidx.fragment:fragment:1.3.0"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"

    // Required for local unit tests (JUnit 4 framework)
    testImplementation 'junit:junit:4.13.2'

    // Required for instrumented tests
    androidTestImplementation "androidx.test:runner:$test_version"
    androidTestImplementation "androidx.test:rules:$test_version"
    androidTestImplementation "androidx.test:core:$test_version"
}
